<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Interview Manager</title>

    <!-- Font Awesome Icons -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- Main CSS -->
    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <!-- Skip for Now -->
    <a
        href="dashboard.html"
        class="top-skip"
        id="skip-for-now"
    >
        Skip for now →
    </a>

    <div class="auth-container">

        <div class="auth-box">

            <!-- Application Logo / Name -->
            <div class="auth-header">

                <div class="app-icon">
                    <i class="fa-solid fa-calendar-check"></i>
                </div>

                <h1>
                    Interview Manager
                </h1>

                <p class="auth-title">
                    Sign in to manage your interviews
                </p>

            </div>

            <!-- Login Form -->
            <form id="login-form">

                <!-- Email -->
                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

                <!-- Password Label + Forgot Password -->
                <div class="password-row">

                    <label for="password">
                        Password
                    </label>

                    <a href="forgot-password.html">
                        Forgot Password?
                    </a>

                </div>

                <!-- Password Input -->
                <div class="password-input-box">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                    <button
                        type="button"
                        id="toggle-password"
                        class="password-toggle"
                        aria-label="Show password"
                    >
                        <i class="fa-regular fa-eye"></i>
                    </button>

                </div>

                <!-- Sign In Button -->
                <button
                    type="submit"
                    class="primary-btn"
                >
                    Sign In
                </button>

            </form>

            <!-- Sign Up -->
            <p class="account-text">
                New to Interview Manager?

                <a href="signup.html">
                    Create an account
                </a>
            </p>

        </div>

    </div>

    <!-- JavaScript -->
    <script src="js/script.js"></script>

</body>

</html>
