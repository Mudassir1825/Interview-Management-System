<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Interview | Interview Management</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="form-container">

        <div class="form-box">

            <h1>Add New Interview</h1>

            <p class="form-subtitle">
                Enter the interview details below
            </p>

            <form autocomplete="off">

                <!-- Candidate Information -->

                <h2>Candidate Information</h2>

                <div class="form-group">
                    <label for="candidate-name">Candidate Name</label>
                    <input
                        type="text"
                        id="candidate-name"
                        placeholder="Enter candidate name"
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter email"
                    >
                </div>

                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your phone number"
                        maxlength="10"
                        inputmode="numeric"
                        autocomplete="off"
                    >
                </div>


                <!-- Interview Information -->

                <h2>Interview Information</h2>

                <div class="form-group">
                    <label for="company">Company</label>
                    <input
                        type="text"
                        id="company"
                        placeholder="Enter company name"
                    >
                </div>

                <div class="form-group">
                    <label for="position">Position</label>
                    <input
                        type="text"
                        id="position"
                        placeholder="Enter job position"
                    >
                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label for="date">Interview Date</label>
                        <input
                            type="date"
                            id="date"
                        >
                    </div>

                    <div class="form-group">
                        <label for="time">Interview Time</label>
                        <input
                            type="time"
                            id="time"
                        >
                    </div>

                </div>

                <div class="form-group">
                    <label for="interviewer">Interviewer</label>
                    <input
                        type="text"
                        id="interviewer"
                        placeholder="Enter interviewer name"
                    >
                </div>

                <div class="form-row">

                    <div class="form-group">

                        <label for="mode">Interview Mode</label>

                        <select id="mode">

                            <option value="">Select mode</option>
                            <option value="online">Online</option>
                            <option value="offline">Offline</option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="status">Status</label>

                        <select id="status">

                            <option value="">Select status</option>
                            <option value="scheduled">Scheduled</option>
                            <option value="completed">Completed</option>
                            <option value="cancelled">Cancelled</option>

                        </select>

                    </div>

                </div>


                <!-- Buttons -->

                <div class="form-buttons">

                    <a href="dashboard.html" class="cancel-btn">
                        Cancel
                    </a>

                    <button type="submit" class="save-btn">
                        Save Interview
                    </button>

                </div>

            </form>

        </div>

    </div>
    
    <script src="js/script.js"></script>

</body>
</html>
