<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Interview Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <div class="app-icon">✓</div>
                <h1>Create Account</h1>
                <p class="auth-title">Create your Interview Manager account</p>
            </div>

            <form action="dashboard.html" id="signup-form" autocomplete="off">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required autocomplete="name">

                <label for="signup-email">Email</label>
                <input type="email" id="signup-email" name="email" placeholder="Enter your email" required autocomplete="email">

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" maxlength="10" inputmode="numeric" pattern="[0-9]{10}" required autocomplete="off">

                <label for="signup-password">Password</label>
                <div class="password-input-box">
                    <input type="password" id="signup-password" name="password" placeholder="Create a password" minlength="8" required autocomplete="new-password">
                    <button type="button" class="password-toggle" id="toggle-signup-password" aria-label="Show password">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>

                <label for="confirm-password">Confirm Password</label>
                <div class="password-input-box">
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password" required autocomplete="new-password">
                    <button type="button" class="password-toggle" id="toggle-confirm-password" aria-label="Show password">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>

                <small class="password-hint">
                    Use at least 8 characters, including an uppercase letter, a lowercase letter, a number, and a special character.
                </small>

                <button type="submit" class="primary-btn">Create Account</button>
            </form>

            <p class="account-text">Already have an account? <a href="index.html">Sign In</a></p>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
